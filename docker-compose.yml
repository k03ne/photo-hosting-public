services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photo}
      POSTGRES_DB: ${POSTGRES_DB:-photohosting}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Nicht auf dem Standard-Port 5432 und nur an localhost gebunden
      # (nicht aus dem Internet erreichbar). Die App verbindet sich intern
      # ohnehin über das Docker-Netz per `db:5432`.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-photo}:${POSTGRES_PASSWORD:-photo}@db:5432/${POSTGRES_DB:-photohosting}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-please}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-too}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/storage/uploads
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - uploads:/app/storage/uploads
    ports:
      # Host-Port 9000 -> Container-Port 3000 (App). Domain zeigt auf 9000.
      - "9000:3000"
    deploy:
      resources:
        limits:
          memory: 1G

  # Optional: S3-kompatibler Storage. Aktivieren mit:
  #   docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      # 9000 ist für die App reserviert -> MinIO-API auf 9002 mappen
      - "9002:9000"
      - "9001:9001"

volumes:
  db_data:
  uploads:
  minio_data:
